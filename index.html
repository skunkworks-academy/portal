      :root{--bg:#050505;--text:#f5f5f5;--muted:#a3a3a3;--line:#2a2a2a;--accent:#7c3aed;--accent2:#06b6d4}*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;background:radial-gradient(circle at top left,rgba(124,58,237,.22),transparent 34rem),radial-gradient(circle at top right,rgba(6,182,212,.18),transparent 32rem),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}#root{min-height:100vh}.boot{min-height:100vh;width:min(1180px,calc(100% - 32px));margin:auto;display:grid;place-items:center;padding:28px 0}.boot-card{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,.55fr);gap:24px;border:1px solid var(--line);border-radius:28px;padding:clamp(22px,5vw,44px);background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.035));box-shadow:0 24px 80px rgba(0,0,0,.35)}.boot h1{margin:0;font-size:clamp(40px,8vw,82px);line-height:.92;letter-spacing:-.07em}.boot p{max-width:740px;color:var(--muted);line-height:1.6}.boot-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.boot-actions a{border:1px solid var(--line);border-radius:999px;padding:11px 15px;color:var(--text);text-decoration:none;font-weight:800}.boot-actions a:first-child{border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}.boot-panel{display:grid;gap:10px}.boot-panel div{border:1px solid var(--line);border-radius:18px;padding:16px;background:rgba(255,255,255,.06)}.boot-panel strong,.boot-panel span{display:block}.boot-panel span{margin-top:4px;color:var(--muted);font-size:14px}@media(max-width:760px){.boot{width:min(100% - 24px,1180px);place-items:start}.boot-card{grid-template-columns:1fr;border-radius:22px}.boot h1{font-size:clamp(38px,14vw,58px)}.boot-actions{display:grid}.boot-actions a{text-align:center}}
    </style>
