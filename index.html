<!doctype html>
<html lang="en-ZA">
  <head>
    <!-- Skunkworks Academy global shell metadata: managed -->
    <meta name="skunkworks:org" content="skunkworks-academy" />
    <meta name="skunkworks:repo" content="portal" />
    <meta name="skunkworks:repo-sitemap" content="https://skunkworksacademy.com/repositories/" />
    <link rel="sitemap" type="text/html" title="Skunkworks Academy Repository Sitemap" href="https://skunkworksacademy.com/repositories/" data-skunkworks-org-sitemap="v1" />
    <!-- The React bundle owns portal styling and the canonical global header. -->
    <meta charset="utf-8" data-skunkworks-head="mandatory-v1" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sign in | Skunkworks Academy Portal</title>
    <meta name="description" content="Secure Microsoft Entra ID sign-in for Skunkworks Academy. Access your private Academy workspace after authentication." />
    <meta name="author" content="Skunkworks Academy" />
    <meta name="publisher" content="Skunkworks Academy" />
    <meta name="application-name" content="Skunkworks Academy Portal" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="https://portal.skunkworksacademy.com/" />
    <link rel="icon" type="image/png" sizes="32x32" href="https://skunkworksacademy.com/images/favicon-black.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="32x32" href="https://skunkworksacademy.com/images/favicon-white.png" media="(prefers-color-scheme: dark)" />
    <link rel="shortcut icon" type="image/png" href="https://skunkworksacademy.com/images/favicon-black.png" />
    <link rel="apple-touch-icon" href="https://skunkworksacademy.com/images/favicon-black.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Skunkworks Academy" />
    <meta property="og:title" content="Skunkworks Academy Portal" />
    <meta property="og:description" content="Sign in securely with Microsoft to access Skunkworks Academy." />
    <meta property="og:url" content="https://portal.skunkworksacademy.com/" />
    <meta property="og:image" content="https://raw.githubusercontent.com/skunkworks-academy/www/refs/heads/main/images/favicon-black.png" />
    <meta property="og:locale" content="en_ZA" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Skunkworks Academy Portal" />
    <meta name="twitter:description" content="Secure Microsoft Entra ID sign-in for Skunkworks Academy." />
    <meta name="twitter:image" content="https://skunkworksacademy.com/images/favicon-black.png" />
    <style>
      :root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light dark}
      *{box-sizing:border-box}
      body{margin:0;min-width:320px;background:#f8f9fb;color:#111827}
      #root{min-height:100svh}
      .portal-boot{min-height:100svh;display:flex;flex-direction:column}
      .portal-boot-header{background:#080c15;color:#fff;padding:18px clamp(18px,5vw,75px);display:flex;align-items:center;gap:12px;letter-spacing:.13em;font-weight:900}
      .portal-boot-header img{width:32px;height:32px;object-fit:contain}
      .portal-boot-body{flex:1;display:grid;place-items:center;padding:40px 20px;text-align:center}
      .portal-boot-body h1{font-size:clamp(30px,5vw,48px);line-height:1.15;letter-spacing:-.055em;margin:0 0 12px}
      .portal-boot-body p{color:#526077;line-height:1.65;margin:0;max-width:490px}
      .portal-boot-footer{border-top:1px solid #dce2ea;padding:16px 24px;text-align:center;color:#68798e;font-size:11px}
      @media(prefers-color-scheme:dark){body{background:#080c13;color:#f2f7ff}.portal-boot-body p{color:#b8c7dd}.portal-boot-footer{border-color:#334155;color:#b8c7dd}}
    </style>
</head>
  <body data-repo="portal" data-domain="portal.skunkworksacademy.com">
    <div id="root">
      <main class="portal-boot" aria-label="Skunkworks Academy secure sign-in loading">
        <header class="portal-boot-header">
          <img src="https://www.skunkworksacademy.com/images/favicon-white.png" alt="" />
          <span>SKUNKWORKS ACADEMY</span>
        </header>
        <section class="portal-boot-body">
          <div><h1>Sign in to Skunkworks Academy</h1><p>Preparing your secure Microsoft sign-in.</p></div>
        </section>
        <footer class="portal-boot-footer">Microsoft Entra ID · Secure authentication</footer>
      </main>
    </div>
    <noscript>
      <div class="portal-boot"><header class="portal-boot-header">SKUNKWORKS ACADEMY</header><main class="portal-boot-body"><div><h1>Microsoft sign-in requires JavaScript</h1><p>Enable JavaScript to sign in to your Academy account.</p></div></main><footer class="portal-boot-footer">© Skunkworks Academy</footer></div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
