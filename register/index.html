<!doctype html>
<html lang="en-ZA" data-registration-page="generic">
  <head>
    <meta charset="utf-8" data-skunkworks-head="mandatory-v1" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="skunkworks:org" content="skunkworks-academy" />
    <meta name="skunkworks:repo" content="portal" />
    <meta name="skunkworks:registration" content="course" />
    <title>Course Registration | Skunkworks Academy Portal</title>
    <meta name="description" content="Register for a Skunkworks Academy course, learning path, material or badge pathway before accessing protected learning content." />
    <meta name="author" content="Skunkworks Academy" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#03033a" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="https://portal.skunkworksacademy.com/register/" />
    <link rel="icon" type="image/png" sizes="32x32" href="https://raw.githubusercontent.com/skunkworks-academy/.github/refs/heads/main/images/favicon-black.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="32x32" href="https://raw.githubusercontent.com/skunkworks-academy/.github/refs/heads/main/images/favicon-white.png" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Skunkworks Academy" />
    <meta property="og:title" content="Course Registration | Skunkworks Academy Portal" />
    <meta property="og:description" content="Register before accessing protected Skunkworks Academy learning content." />
    <meta property="og:url" content="https://portal.skunkworksacademy.com/register/" />
    <meta property="og:image" content="https://raw.githubusercontent.com/skunkworks-academy/.github/refs/heads/main/images/favicon-black.png" />
  </head>
  <body>
    <a class="skip-link" href="#registration-main">Skip to registration form</a>
    <div id="root"></div>
    <noscript>
      <main class="registration-noscript">
        <section class="registration-card">
          <h1>Course registration requires JavaScript</h1>
          <p>Please enable JavaScript so the selected course can be loaded and your registration request can include the correct course code.</p>
          <a href="https://portal.skunkworksacademy.com/">Open Portal</a>
        </section>
      </main>
    </noscript>
    <script type="module" src="/src/register/main.tsx"></script>
  </body>
</html>
