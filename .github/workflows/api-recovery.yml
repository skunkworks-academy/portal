name: Recover Portal Functions API

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-api-recovery
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Resolve Kudu endpoint from publish profile
        id: profile
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import pathlib
          import xml.etree.ElementTree as ET

          raw = os.environ.get('PUBLISH_PROFILE', '').strip()
          if not raw:
              raise SystemExit('AZURE_FUNCTIONAPP_PUBLISH_PROFILE is missing.')

          root = ET.fromstring(raw)
          profiles = root.findall('.//publishProfile')
          selected = None
          for profile in profiles:
              if (profile.attrib.get('publishMethod') or '').lower() == 'msdeploy':
                  selected = profile
                  break
          if selected is None and profiles:
              selected = profiles[0]
          if selected is None:
              raise SystemExit('No publish profile entry was found.')

          app_name = (selected.attrib.get('msdeploySite') or '').strip()
          destination = (selected.attrib.get('destinationAppUrl') or '').strip()
          publish_url = (selected.attrib.get('publishUrl') or '').strip()
          username = selected.attrib.get('userName') or ''
          password = selected.attrib.get('userPWD') or ''

          if not publish_url or not username or not password:
              raise SystemExit('Publish profile does not contain Kudu deployment credentials.')

          if not publish_url.startswith(('http://', 'https://')):
              publish_url = f'https://{publish_url}'
          publish_url = publish_url.rstrip('/')

          pathlib.Path('/tmp/kudu-url').write_text(publish_url, encoding='utf-8')
          pathlib.Path('/tmp/kudu-user').write_text(username, encoding='utf-8')
          pathlib.Path('/tmp/kudu-password').write_text(password, encoding='utf-8')
          os.chmod('/tmp/kudu-user', 0o600)
          os.chmod('/tmp/kudu-password', 0o600)

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'app_name={app_name}\n')
              output.write(f'destination={destination}\n')

          print(f'Resolved Function App: {app_name or "unknown"}')
          if destination:
              print(f'Destination: {destination}')
          print('Kudu deployment endpoint resolved from the protected publish profile.')
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Azure Functions API
        run: npm run build:api

      - name: Assemble deployment package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf function-package function-package.zip
          mkdir -p function-package
          cp host.json package.json package-lock.json function-package/
          cp -R api-dist function-package/api-dist
          cd function-package
          npm ci --omit=dev --no-audit --no-fund
          zip -qr ../function-package.zip .

      - name: Deploy package through Kudu ZIP deploy
        shell: bash
        run: |
          set -euo pipefail
          kudu_url=$(cat /tmp/kudu-url)
          kudu_user=$(cat /tmp/kudu-user)
          kudu_password=$(cat /tmp/kudu-password)
          response_file=/tmp/kudu-response.txt

          status=$(curl \
            --silent \
            --show-error \
            --location \
            --connect-timeout 20 \
            --max-time 300 \
            --user "${kudu_user}:${kudu_password}" \
            --request POST \
            --header 'Content-Type: application/zip' \
            --data-binary @function-package.zip \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            "${kudu_url}/api/zipdeploy" || true)

          echo "Kudu ZIP deployment HTTP status: ${status}"
          cat "${response_file}" || true

          if [[ "${status}" != '200' && "${status}" != '202' ]]; then
            echo 'Kudu rejected the deployment package.' >&2
            exit 1
          fi

      - name: Verify health and checkout plans
        shell: bash
        run: |
          set -euo pipefail
          base='https://skunkworks-instructor-portal-api-a5gxhyc2fvc7gmch.southafricanorth-01.azurewebsites.net/api'

          for attempt in $(seq 1 36); do
            echo "Health check attempt ${attempt}/36"
            health_status=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
              --output /tmp/health.json --write-out '%{http_code}' "${base}/health" || true)
            plans_status=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
              --output /tmp/plans.json --write-out '%{http_code}' "${base}/checkout/plans" || true)

            if [[ "${health_status}" == '200' && "${plans_status}" == '200' ]] \
              && grep -q 'starter-monthly' /tmp/plans.json; then
              echo 'Portal Functions API and checkout plans are healthy.'
              cat /tmp/health.json
              exit 0
            fi

            echo "health=${health_status} plans=${plans_status}"
            sleep 10
          done

          echo 'The Function App did not become healthy after deployment.' >&2
          echo 'Health response:' >&2
          cat /tmp/health.json >&2 || true
          echo 'Plans response:' >&2
          cat /tmp/plans.json >&2 || true
          exit 1
