name: One-time audited dependency lock refresh
on:
  push:
    branches:
      - fix/entra-login-only-20261026
    paths:
      - .github/workflows/repair-package-lock-20261026.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/entra-login-only-20261026
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Regenerate and audit dependency lock from patched semver overrides
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.19.1
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit
          npm ci
          npm audit --omit=dev --audit-level=high
          npm test
          npm run build
          npm run build:api
      - name: Commit reviewed package lock and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/repair-package-lock-20261026.yml
          git commit -m "fix(security): regenerate audited lockfile and verify portal build"
          git push origin HEAD:fix/entra-login-only-20261026
