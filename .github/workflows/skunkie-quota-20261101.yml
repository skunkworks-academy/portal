name: Skunkie quota and deployment capacity (read-only)
on:
  push:
    branches:
      - diagnostic/skunkie-azure-ai-inventory-20261101
    paths:
      - .github/workflows/skunkie-quota-20261101.yml
permissions:
  id-token: write
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
    steps:
      - name: Check configured production Azure target
        shell: bash
        run: |
          set -euo pipefail
          for name in AZURE_SUBSCRIPTION_ID AZURE_TENANT_ID AZURE_CLIENT_ID; do
            if [ -z "${!name:-}" ]; then echo "::error::Missing production Azure identity setting"; exit 1; fi
          done
      - name: Sign in to the existing authorised Azure subscription
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          auth-type: SERVICE_PRINCIPAL
      - name: Inspect Azure OpenAI quota and model capacity without writes
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            tmp="$(mktemp -d)"
            trap 'rm -rf "$tmp"' EXIT
            actual="$(az account show --query id -o tsv)"
            if [ "$actual" != "$AZURE_SUBSCRIPTION_ID" ]; then
              echo "::error::Unexpected subscription"
              exit 1
            fi
            echo "## Skunkie model quota and capacity — read-only" >> "$GITHUB_STEP_SUMMARY"
            if az rest --method get \
              --url "https://management.azure.com/subscriptions/$AZURE_SUBSCRIPTION_ID/providers/Microsoft.CognitiveServices/locations/southafricanorth/usages?api-version=2024-10-01" \
              --only-show-errors --output json > "$tmp/usages.json" 2>"$tmp/usages.err"; then
              n="$(jq '(.value // []) | length' "$tmp/usages.json")"
              relevant="$(jq '[(.value // [])[] | select((.name.value // "") | test("gpt-4\\.1-mini|gpt-4o";"i"))] | length' "$tmp/usages.json")"
              echo "Quota entries total=$n target-model entries=$relevant"
              jq -r '(.value // [])[] | select((.name.value // "") | test("gpt-4\\.1-mini|gpt-4o";"i")) | "quota: \\(.name.value): \\(.currentValue)/\\(.limit)"' "$tmp/usages.json" | head -25
              echo "- Quota rows visible: $n; matching target-model quotas: $relevant" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Subscription-scoped quota inspection is unavailable to this identity; Cognitive Services Usages Reader at subscription scope may be required."
              echo "- Quota: not accessible under current identity" >> "$GITHUB_STEP_SUMMARY"
            fi
            if az rest --method get \
              --url "https://management.azure.com/subscriptions/$AZURE_SUBSCRIPTION_ID/providers/Microsoft.CognitiveServices/modelCapacities?api-version=2024-10-01&modelFormat=OpenAI&modelName=gpt-4.1-mini&modelVersion=2025-04-14" \
              --only-show-errors --output json > "$tmp/capacity.json" 2>"$tmp/capacity.err"; then
              jq -r '(.value // [])[] | select((.location // "") == "southafricanorth") | "SA North capacity: \\(.properties.skuName)=\\(.properties.availableCapacity)"' "$tmp/capacity.json" | head -20
              entries="$(jq '[(.value // [])[] | select((.location // "") == "southafricanorth")] | length' "$tmp/capacity.json")"
              echo "- gpt-4.1-mini (2025-04-14) South Africa North capacity entries: $entries" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Model capacities unavailable to this identity or subscription."
              echo "- Model capacities: not accessible" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "No AI model was deployed; no resources, secrets, app settings or permissions were modified."
