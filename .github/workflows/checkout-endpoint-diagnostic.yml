name: Diagnose live checkout endpoints

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe checkout page and APIs
        shell: bash
        run: |
          set -u

          probe() {
            local label="$1"
            local url="$2"
            local output="/tmp/${label}.body"
            local headers="/tmp/${label}.headers"

            echo "::group::${label}"
            status=$(curl \
              --silent \
              --show-error \
              --location \
              --connect-timeout 15 \
              --max-time 45 \
              --dump-header "${headers}" \
              --output "${output}" \
              --write-out '%{http_code}' \
              "${url}" || true)
            echo "URL: ${url}"
            echo "HTTP: ${status}"
            grep -iE '^(content-type|access-control-allow-origin|server|location):' "${headers}" || true
            head -c 500 "${output}" || true
            echo
            echo "::endgroup::"
          }

          probe portal_checkout 'https://portal.skunkworksacademy.com/checkout/?course=OSINT-101&source=osint'
          probe custom_api 'https://api.skunkworksacademy.com/api/checkout/plans'
          probe azure_api 'https://skunkworks-academy-portal-api-za.azurewebsites.net/api/checkout/plans'
          probe azure_admin_applications 'https://skunkworks-academy-portal-api-za.azurewebsites.net/api/admin/applications'
          probe azure_admin_profiles 'https://skunkworks-academy-portal-api-za.azurewebsites.net/api/admin/profiles'
          probe azure_admin_jobs 'https://skunkworks-academy-portal-api-za.azurewebsites.net/api/admin/jobs'
          probe azure_me_profile 'https://skunkworks-academy-portal-api-za.azurewebsites.net/api/me/profile'

      - name: Require canonical Portal API health and admin route
        shell: bash
        run: |
          set -euo pipefail
          API_BASE_URL='https://skunkworks-academy-portal-api-za.azurewebsites.net/api'
          health=$(curl --fail --silent --show-error --location --connect-timeout 15 --max-time 45 "$API_BASE_URL/health")
          echo "$health" | jq -e '.ok == true and ((.routes // []) | index("GET /api/admin/applications") != null)' >/dev/null

          admin_status=$(curl --silent --show-error --location --connect-timeout 15 --max-time 45 \
            --output /tmp/admin-applications.body --write-out '%{http_code}' "$API_BASE_URL/admin/applications" || true)
          case "$admin_status" in
            401|403) echo "Admin applications endpoint resolves and requires authentication (HTTP $admin_status)." ;;
            *)
              echo "Expected unauthenticated admin applications response to be 401 or 403; got HTTP $admin_status." >&2
              head -c 500 /tmp/admin-applications.body || true
              exit 1
              ;;
          esac

      - name: Require at least one valid plans endpoint
        shell: bash
        run: |
          set -euo pipefail
          custom_ok=false
          azure_ok=false

          if curl --fail --silent --show-error --location --connect-timeout 15 --max-time 45 \
            'https://api.skunkworksacademy.com/api/checkout/plans' | grep -q 'starter-monthly'; then
            custom_ok=true
          fi

          if curl --fail --silent --show-error --location --connect-timeout 15 --max-time 45 \
            'https://skunkworks-academy-portal-api-za.azurewebsites.net/api/checkout/plans' | grep -q 'starter-monthly'; then
            azure_ok=true
          fi

          echo "custom_api_valid=${custom_ok}"
          echo "azure_api_valid=${azure_ok}"

          if [[ "${custom_ok}" != "true" && "${azure_ok}" != "true" ]]; then
            echo 'No checkout plans endpoint returned valid plan data.' >&2
            exit 1
          fi
