name: Deploy portal API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - api/**
      - src/types.ts
      - package.json
      - package-lock.json
      - tsconfig.api.json
      - host.json
      - .github/workflows/main_skunkworks-instructor-portal-api.yml

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build:api

      - name: Package API
        run: |
          mkdir package
          cp host.json package/host.json
          cp package.json package/package.json
          cp package-lock.json package/package-lock.json 2>/dev/null || true
          cp -r api-dist/api package/api
          cp -r api-dist/src package/src
          node -e "const fs = require('node:fs'); const pkg = JSON.parse(fs.readFileSync('package/package.json', 'utf8')); pkg.main = 'api/functions.js'; fs.writeFileSync('package/package.json', JSON.stringify(pkg, null, 2) + '\n');"
          cd package
          npm ci --omit=dev
          zip -r ../release.zip .

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: skunkworks-instructor-portal-api
          package: release.zip
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          sku: flexconsumption
