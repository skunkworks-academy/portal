name: Deploy portal API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - api/**
      - src/types.ts
      - package.json
      - package-lock.json
      - tsconfig.api.json
      - host.json
      - .github/workflows/main_skunkworks-instructor-portal-api.yml

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install

      - run: npm run build:api

      - name: Package API
        run: |
          mkdir package
          cp -r api-dist package/api-dist
          cp host.json package/host.json
          cp package.json package/package.json
          cp package-lock.json package/package-lock.json 2>/dev/null || true
          cd package
          npm install --omit=dev
          zip -r ../release.zip .

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: skunkworks-instructor-portal-api
          package: release.zip
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
