name: Skunkie Azure AI subscription preparation

on:
  push:
    branches:
      - diagnostic/skunkie-azure-ai-inventory-20261101


permissions:
  id-token: write
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
    steps:
      - name: Verify configured Azure federation target
        shell: bash
        run: |
          set -euo pipefail
          for key in AZURE_SUBSCRIPTION_ID AZURE_TENANT_ID AZURE_CLIENT_ID; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing the authorised production Azure federation setting: $key"
              exit 1
            fi
          done

      - name: Sign in to configured Azure subscription
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          auth-type: SERVICE_PRINCIPAL

      - name: Register Microsoft Cognitive Services resource provider
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            current="$(az provider show --namespace Microsoft.CognitiveServices --query registrationState -o tsv)"
            if [ "$current" = "Registered" ]; then
              echo "Microsoft.CognitiveServices provider is already registered."
            elif [ "$current" = "NotRegistered" ] || [ "$current" = "Unregistered" ]; then
              echo "Requesting registration of Microsoft.CognitiveServices for the authorised production subscription."
              az provider register --namespace Microsoft.CognitiveServices --only-show-errors --output none
              echo "Registration request submitted."
            else
              echo "Current Microsoft.CognitiveServices state: $current"
            fi
            next="$(az provider show --namespace Microsoft.CognitiveServices --query registrationState -o tsv)"
            echo "Microsoft.CognitiveServices registration state: $next"
            echo "- Cognitive Services resource provider state after request: $next" >> "$GITHUB_STEP_SUMMARY"

      - name: Discover existing Azure AI resources and model deployments (no writes)
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            umask 077
            inventory_dir="$(mktemp -d)"
            trap 'rm -rf "$inventory_dir"' EXIT

            actual_subscription="$(az account show --query id -o tsv)"
            if [ "$actual_subscription" != "$AZURE_SUBSCRIPTION_ID" ]; then
              echo "::error::Azure subscription did not match the approved production target."
              exit 1
            fi

            # Do not print internal endpoint URLs, resource names or any key material.
            az cognitiveservices account list --only-show-errors -o json > "$inventory_dir/accounts.json"
            jq -r '.[] | select((.kind // "") == "OpenAI" or (.kind // "") == "AIServices") | [.name, .resourceGroup] | @tsv' "$inventory_dir/accounts.json" > "$inventory_dir/ai-resources.tsv"
            account_count="$(wc -l < "$inventory_dir/ai-resources.tsv" | tr -d ' ')"
            deployment_count=0
            chat_deployment_count=0
            failures=0

            while IFS="$(printf '\t')" read -r account_name resource_group; do
              [ -n "$account_name" ] || continue
              if az cognitiveservices account deployment list \
                --resource-group "$resource_group" --name "$account_name" \
                --only-show-errors -o json > "$inventory_dir/deployments.json" 2>"$inventory_dir/read-error.txt"; then
                count="$(jq 'length' "$inventory_dir/deployments.json")"
                deployment_count=$((deployment_count + count))
                matches="$(jq '[.[] | select((.properties.model.format // "") == "OpenAI") | select((.properties.provisioningState // "") == "Succeeded")] | length' "$inventory_dir/deployments.json")"
                chat_deployment_count=$((chat_deployment_count + matches))
              else
                failures=$((failures + 1))
                echo "::warning::A Cognitive Services deployment inventory could not be read with the configured Azure identity."
              fi
            done < "$inventory_dir/ai-resources.tsv"

            {
              echo "## Skunkie Azure AI inventory — read only"
              echo ""
              echo "- Azure AI resource candidates visible to the existing production identity: $account_count"
              echo "- Total existing model deployments observed: $deployment_count"
              echo "- Successfully provisioned OpenAI-format model deployments: $chat_deployment_count"
              echo "- Deployment enumeration failures: $failures"
              echo ""
              echo "This workflow may register the Microsoft.CognitiveServices resource provider. It does not create metered AI resources or models, read keys, update Function App settings or change the Portal."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Azure AI inventory complete (counts only): candidates=$account_count, deployments=$deployment_count, ready-format=$chat_deployment_count, access-errors=$failures"

            # Read-only regional capability check. A listed SKU is not proof of
            # model capacity or Azure OpenAI account provisioning approval.
            if az cognitiveservices account list-skus --kind OpenAI --location southafricanorth \
                 --only-show-errors -o json > "$inventory_dir/skus.json" 2>"$inventory_dir/sku-error.txt"; then
              regional_skus="$(jq 'length' "$inventory_dir/skus.json")"
              echo "- Visible OpenAI account SKUs for South Africa North: $regional_skus" >> "$GITHUB_STEP_SUMMARY"
              echo "Regional OpenAI SKU count for South Africa North: $regional_skus"
            else
              echo "- South Africa North OpenAI SKU check unavailable with the existing federated identity." >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::Unable to query South Africa North OpenAI account SKUs."
            fi

            provider_state="$(az provider show --namespace Microsoft.CognitiveServices --query registrationState -o tsv 2>/dev/null || true)"
            if [ -n "$provider_state" ]; then
              echo "- Cognitive Services resource provider registration: $provider_state" >> "$GITHUB_STEP_SUMMARY"
              echo "Cognitive Services registration state: $provider_state"
            fi
            if az cognitiveservices model list --location southafricanorth --only-show-errors -o json > "$inventory_dir/models.json" 2>"$inventory_dir/models-error.txt"; then
              # Read-only inspection: model deployment SKU and version availability
              # in this subscription; no model or billable resource is created.
              model_total="$(jq 'if type == "array" then length else 0 end' "$inventory_dir/models.json")"
              echo "- Total regional model catalogue rows visible in subscription: $model_total" >> "$GITHUB_STEP_SUMMARY"
              echo "Model catalogue rows visible: $model_total"
              if [ "$model_total" -gt 0 ]; then
                echo "First model catalogue item field names (not values): $(jq -r '.[0] | keys | join(",")' "$inventory_dir/models.json")"
                echo "OpenAI model IDs visible: $(jq -r '[.[] | ((.model.name // .name // "") | tostring) | select(startswith("gpt-"))] | unique | join(",")' "$inventory_dir/models.json" | cut -c1-200)"
              fi
              regional_mini="$(jq '[.[] | select((.model.name // "") == "gpt-4.1-mini" and (.skuName // "") == "Standard")] | length' "$inventory_dir/models.json")"
              global_mini="$(jq '[.[] | select((.model.name // "") == "gpt-4.1-mini" and (.skuName // "") == "GlobalStandard")] | length' "$inventory_dir/models.json")"
              regional_4o="$(jq '[.[] | select((.model.name // "") == "gpt-4o" and (.skuName // "") == "Standard")] | length' "$inventory_dir/models.json")"
              echo "- gpt-4.1-mini regional Standard deployment options: $regional_mini" >> "$GITHUB_STEP_SUMMARY"
              echo "- gpt-4.1-mini GlobalStandard deployment options: $global_mini" >> "$GITHUB_STEP_SUMMARY"
              echo "- gpt-4o regional Standard deployment options: $regional_4o" >> "$GITHUB_STEP_SUMMARY"
              echo "Model availability (SA North): mini-regional=$regional_mini mini-global=$global_mini gpt4o-regional=$regional_4o"
            else
              echo "::warning::Subscription model catalogue is unavailable; further registration or quota approval may be required."
              echo "- Model catalogue check: unavailable under the current subscription permissions/provider state." >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ "$account_count" -eq 0 ]; then
              echo "::warning::No accessible existing OpenAI/AIServices resource was found in the configured production subscription."
            fi
