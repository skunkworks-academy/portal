name: Deploy Azure Function

on:
  workflow_dispatch:
    inputs:
      function_app_name:
        description: Globally unique Azure Function App name
        required: false
      storage_account_name:
        description: Globally unique lowercase storage account name
        required: false
      location:
        description: Azure region
        required: false
        default: southafricanorth
  push:
    branches: [main]
    paths:
      - api/**
      - host.json
      - package.json
      - package-lock.json
      - tsconfig.api.json
      - infra/**
      - scripts/bootstrap-azure-oidc.ps1
      - .github/workflows/deploy-azure-function.yml

permissions:
  contents: read
  id-token: write
  actions: write

concurrency:
  group: portal-api-production
  cancel-in-progress: false

env:
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  RESOURCE_GROUP_NAME: ${{ vars.AZURE_RESOURCE_GROUP_NAME || 'rg-skunkworks-academy-portal-prod' }}
  FUNCTION_APP_NAME: ${{ inputs.function_app_name || vars.AZURE_FUNCTIONAPP_NAME }}
  STORAGE_ACCOUNT_NAME: ${{ inputs.storage_account_name || vars.AZURE_STORAGE_ACCOUNT_NAME }}
  LOCATION: ${{ inputs.location || vars.AZURE_LOCATION || 'southafricanorth' }}
  PORTAL_ENTRA_TENANT_ID: ${{ vars.PORTAL_ENTRA_TENANT_ID || '338a8916-80d9-467c-a94a-7f61d04ef7d5' }}
  PORTAL_ENTRA_CLIENT_ID: ${{ vars.PORTAL_ENTRA_CLIENT_ID || 'e22672ae-61a6-434e-b135-3360557819ec' }}
  PORTAL_APPLICATION_ID_URI: ${{ vars.PORTAL_APPLICATION_ID_URI || 'api://e22672ae-61a6-434e-b135-3360557819ec' }}
  PORTAL_API_SCOPE: ${{ vars.PORTAL_API_SCOPE || 'api://e22672ae-61a6-434e-b135-3360557819ec/access_as_user' }}
  PORTAL_ALLOWED_ORIGINS: ${{ vars.PORTAL_ALLOWED_ORIGINS || 'https://portal.skunkworksacademy.com,http://localhost:5173' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:api
      - name: Validate Bicep
        uses: azure/cli@v2
        with:
          inlineScript: az bicep build --file infra/main.bicep

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:api

      - name: Verify deployment variables and identity contract
        shell: bash
        run: |
          set -euo pipefail
          for name in AZURE_SUBSCRIPTION_ID AZURE_TENANT_ID AZURE_CLIENT_ID FUNCTION_APP_NAME STORAGE_ACCOUNT_NAME PORTAL_ENTRA_TENANT_ID PORTAL_ENTRA_CLIENT_ID PORTAL_APPLICATION_ID_URI PORTAL_API_SCOPE PORTAL_ALLOWED_ORIGINS; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions variable: $name" >&2
              exit 1
            fi
          done
          if [[ ! "$STORAGE_ACCOUNT_NAME" =~ ^[a-z0-9]{3,24}$ ]]; then
            echo "AZURE_STORAGE_ACCOUNT_NAME must be 3-24 lowercase alphanumeric characters." >&2
            exit 1
          fi
          if [[ "$PORTAL_APPLICATION_ID_URI" != "api://${PORTAL_ENTRA_CLIENT_ID}" ]]; then
            echo "PORTAL_APPLICATION_ID_URI must match api://PORTAL_ENTRA_CLIENT_ID." >&2
            exit 1
          fi
          if [[ "$PORTAL_API_SCOPE" != "${PORTAL_APPLICATION_ID_URI}/access_as_user" ]]; then
            echo "PORTAL_API_SCOPE must match PORTAL_APPLICATION_ID_URI/access_as_user." >&2
            exit 1
          fi
          if [[ "$PORTAL_ALLOWED_ORIGINS" != *"https://portal.skunkworksacademy.com"* ]]; then
            echo "PORTAL_ALLOWED_ORIGINS must include https://portal.skunkworksacademy.com." >&2
            exit 1
          fi

      - name: Azure login using workload identity
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          auth-type: SERVICE_PRINCIPAL

      - name: Confirm Azure context
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            actual_subscription="$(az account show --query id -o tsv)"
            actual_tenant="$(az account show --query tenantId -o tsv)"
            if [ "$actual_subscription" != "$AZURE_SUBSCRIPTION_ID" ]; then
              echo "Azure login selected unexpected subscription: $actual_subscription" >&2
              exit 1
            fi
            if [ "$actual_tenant" != "$AZURE_TENANT_ID" ]; then
              echo "Azure login selected unexpected tenant: $actual_tenant" >&2
              exit 1
            fi
            az account show --query '{subscription:id,tenant:tenantId,name:name}' -o json

      - name: Provision Function App infrastructure and discover endpoint
        id: provision
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            DEPLOYMENT_NAME="portal-api-${{ github.run_number }}"

            az deployment sub create \
              --name "$DEPLOYMENT_NAME" \
              --location "$LOCATION" \
              --template-file infra/main.bicep \
              --parameters \
                location="$LOCATION" \
                resourceGroupName="$RESOURCE_GROUP_NAME" \
                functionAppName="$FUNCTION_APP_NAME" \
                storageAccountName="$STORAGE_ACCOUNT_NAME" \
                entraTenantId="$PORTAL_ENTRA_TENANT_ID" \
                portalClientId="$PORTAL_ENTRA_CLIENT_ID" \
                applicationIdUri="$PORTAL_APPLICATION_ID_URI" \
                apiScope="$PORTAL_API_SCOPE" \
                allowedOrigins="$PORTAL_ALLOWED_ORIGINS" \
              --output none

            API_BASE_URL="$(az deployment sub show \
              --name "$DEPLOYMENT_NAME" \
              --query 'properties.outputs.apiBaseUrl.value' \
              -o tsv)"

            FUNCTION_DEFAULT_HOSTNAME="$(az functionapp show \
              --resource-group "$RESOURCE_GROUP_NAME" \
              --name "$FUNCTION_APP_NAME" \
              --query defaultHostName \
              -o tsv)"

            if [ -z "$API_BASE_URL" ] || [ -z "$FUNCTION_DEFAULT_HOSTNAME" ]; then
              echo "Azure did not return the Function App default hostname or API base URL." >&2
              exit 1
            fi

            EXPECTED_API_BASE_URL="https://${FUNCTION_DEFAULT_HOSTNAME}/api"
            if [ "$API_BASE_URL" != "$EXPECTED_API_BASE_URL" ]; then
              echo "Bicep output does not match the Function App default hostname." >&2
              echo "Bicep:    $API_BASE_URL" >&2
              echo "Expected: $EXPECTED_API_BASE_URL" >&2
              exit 1
            fi

            echo "Discovered Function hostname: $FUNCTION_DEFAULT_HOSTNAME"
            echo "Discovered API base URL: $API_BASE_URL"
            echo "FUNCTION_DEFAULT_HOSTNAME=$FUNCTION_DEFAULT_HOSTNAME" >> "$GITHUB_ENV"
            echo "PORTAL_API_BASE_URL=$API_BASE_URL" >> "$GITHUB_ENV"
            echo "api_base_url=$API_BASE_URL" >> "$GITHUB_OUTPUT"

      - name: Assemble Function deployment package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf function-package function-package.zip
          mkdir -p function-package
          cp -R api-dist function-package/api-dist
          cp host.json package.json package-lock.json function-package/
          cd function-package
          npm ci --omit=dev
          zip -qr ../function-package.zip .

      - name: Deploy Function package through Azure CLI
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            az functionapp deployment source config-zip \
              --resource-group "$RESOURCE_GROUP_NAME" \
              --name "$FUNCTION_APP_NAME" \
              --src function-package.zip \
              --build-remote false \
              --timeout 600 \
              --output json

      - name: Restart Function App
        uses: azure/cli@v2
        with:
          inlineScript: az functionapp restart --resource-group "$RESOURCE_GROUP_NAME" --name "$FUNCTION_APP_NAME"

      - name: Verify deployed application settings
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            az functionapp config appsettings list \
              --resource-group "$RESOURCE_GROUP_NAME" \
              --name "$FUNCTION_APP_NAME" \
              --query "[?name=='ENTRA_TENANT_ID' || name=='API_CLIENT_ID' || name=='SPA_CLIENT_ID' || name=='APPLICATION_ID_URI' || name=='API_SCOPE' || name=='ALLOWED_ORIGINS'].{name:name,value:value}" \
              -o table

      - name: Verify API health and CORS on discovered hostname
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_URL="${PORTAL_API_BASE_URL%/}/health"
          PREFLIGHT_URL="${PORTAL_API_BASE_URL%/}/admin/applications"
          HEALTH_BODY="$(mktemp)"
          HEALTH_HEADERS="$(mktemp)"
          CORS_HEADERS="$(mktemp)"

          echo "Checking $HEALTH_URL"
          for attempt in {1..18}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 20 \
              -H "Origin: https://portal.skunkworksacademy.com" \
              -D "$HEALTH_HEADERS" \
              -o "$HEALTH_BODY" \
              "$HEALTH_URL"; then
              break
            fi

            if [ "$attempt" -eq 18 ]; then
              echo "Function health check failed after 18 attempts." >&2
              exit 1
            fi

            echo "Health check attempt $attempt failed; retrying in 10 seconds."
            sleep 10
          done

          node - "$HEALTH_BODY" <<'NODE'
          const fs = require("node:fs");
          const path = process.argv[2];
          const health = JSON.parse(fs.readFileSync(path, "utf8"));
          if (health.ok !== true) {
            console.error("Portal API health response did not contain ok: true.");
            process.exit(1);
          }
          if (Array.isArray(health.missingSettings) && health.missingSettings.length > 0) {
            console.warn(`Portal API reports missing settings: ${health.missingSettings.join(", ")}`);
          }
          console.log(JSON.stringify(health));
          NODE

          if ! grep -Eiq '^access-control-allow-origin:[[:space:]]*https://portal\.skunkworksacademy\.com[[:space:]]*$' "$HEALTH_HEADERS"; then
            echo "Health response does not allow the Portal production origin." >&2
            cat "$HEALTH_HEADERS" >&2
            exit 1
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 30 \
            -X OPTIONS \
            -H "Origin: https://portal.skunkworksacademy.com" \
            -H "Access-Control-Request-Method: GET" \
            -H "Access-Control-Request-Headers: authorization" \
            -D "$CORS_HEADERS" \
            -o /dev/null \
            "$PREFLIGHT_URL"

          if ! grep -Eiq '^access-control-allow-origin:[[:space:]]*https://portal\.skunkworksacademy\.com[[:space:]]*$' "$CORS_HEADERS"; then
            echo "Authenticated-route preflight does not allow the Portal production origin." >&2
            cat "$CORS_HEADERS" >&2
            exit 1
          fi

      - name: Redeploy frontend with discovered API endpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run pages.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f api_base_url="$PORTAL_API_BASE_URL"

      - name: Publish endpoint summary
        shell: bash
        run: |
          {
            echo "## Portal API deployment"
            echo
            echo "- Function App: \`$FUNCTION_APP_NAME\`"
            echo "- Default hostname: \`$FUNCTION_DEFAULT_HOSTNAME\`"
            echo "- API base URL: \`$PORTAL_API_BASE_URL\`"
            echo "- Health URL: \`${PORTAL_API_BASE_URL%/}/health\`"
          } >> "$GITHUB_STEP_SUMMARY"
