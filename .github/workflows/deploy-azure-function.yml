name: Deploy Azure Function

on:
  workflow_dispatch:
    inputs:
      function_app_name:
        description: Globally unique Azure Function App name
        required: false
      storage_account_name:
        description: Globally unique lowercase storage account name
        required: false
      location:
        description: Azure region
        required: false
        default: southafricanorth
      load_requests:
        description: Bounded total read-only production API validation requests (12-300)
        required: false
        default: "60"
      load_concurrency:
        description: Bounded concurrent production API validation workers (1-12)
        required: false
        default: "4"
      load_rps:
        description: Bounded production API request-start rate (0.25-10)
        required: false
        default: "2"
  push:
    branches: [main]
    paths:
      - api/**
      - host.json
      - package.json
      - package-lock.json
      - tsconfig.api.json
      - infra/**
      - scripts/bootstrap-azure-oidc.ps1
      - .github/workflows/deploy-azure-function.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: portal-api-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate:ai-publication -- --remote
      - run: npm run build:api
      - name: Validate Bicep
        uses: azure/cli@v2
        with:
          inlineScript: az bicep build --file infra/main.bicep

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      RESOURCE_GROUP_NAME: ${{ vars.AZURE_RESOURCE_GROUP_NAME || 'rg-skunkworks-academy-portal-prod' }}
      FUNCTION_APP_NAME: ${{ inputs.function_app_name || vars.AZURE_FUNCTIONAPP_NAME }}
      STORAGE_ACCOUNT_NAME: ${{ inputs.storage_account_name || vars.AZURE_STORAGE_ACCOUNT_NAME }}
      LOCATION: ${{ inputs.location || vars.AZURE_LOCATION || 'southafricanorth' }}
      PORTAL_ENTRA_TENANT_ID: ${{ vars.PORTAL_ENTRA_TENANT_ID || '338a8916-80d9-467c-a94a-7f61d04ef7d5' }}
      PORTAL_ENTRA_CLIENT_ID: ${{ vars.PORTAL_ENTRA_CLIENT_ID || 'e22672ae-61a6-434e-b135-3360557819ec' }}
      PORTAL_APPLICATION_ID_URI: ${{ vars.PORTAL_APPLICATION_ID_URI || 'api://e22672ae-61a6-434e-b135-3360557819ec' }}
      PORTAL_API_SCOPE: ${{ vars.PORTAL_API_SCOPE || 'api://e22672ae-61a6-434e-b135-3360557819ec/access_as_user' }}
      PORTAL_ALLOWED_ORIGINS: ${{ vars.PORTAL_ALLOWED_ORIGINS || 'https://portal.skunkworksacademy.com,http://localhost:5173' }}
      PORTAL_SHAREPOINT_HOSTNAME: ${{ vars.PORTAL_SHAREPOINT_HOSTNAME || '202025721807skunkworks.sharepoint.com' }}
      PORTAL_SHAREPOINT_SITE_PATH: ${{ vars.PORTAL_SHAREPOINT_SITE_PATH || '/sites/InstructorPortal' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:api

      - name: Verify deployment variables and identity contract
        shell: bash
        run: |
          set -euo pipefail
          for name in AZURE_SUBSCRIPTION_ID AZURE_TENANT_ID AZURE_CLIENT_ID FUNCTION_APP_NAME STORAGE_ACCOUNT_NAME PORTAL_ENTRA_TENANT_ID PORTAL_ENTRA_CLIENT_ID PORTAL_APPLICATION_ID_URI PORTAL_API_SCOPE PORTAL_ALLOWED_ORIGINS PORTAL_SHAREPOINT_HOSTNAME PORTAL_SHAREPOINT_SITE_PATH; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions variable: $name" >&2
              exit 1
            fi
          done
          if [[ ! "$STORAGE_ACCOUNT_NAME" =~ ^[a-z0-9]{3,24}$ ]]; then
            echo "AZURE_STORAGE_ACCOUNT_NAME must be 3-24 lowercase alphanumeric characters." >&2
            exit 1
          fi
          if [[ "$PORTAL_APPLICATION_ID_URI" != "api://${PORTAL_ENTRA_CLIENT_ID}" ]]; then
            echo "PORTAL_APPLICATION_ID_URI must match api://PORTAL_ENTRA_CLIENT_ID." >&2
            exit 1
          fi
          if [[ "$PORTAL_API_SCOPE" != "${PORTAL_APPLICATION_ID_URI}/access_as_user" ]]; then
            echo "PORTAL_API_SCOPE must match PORTAL_APPLICATION_ID_URI/access_as_user." >&2
            exit 1
          fi
          if [[ "$PORTAL_ALLOWED_ORIGINS" != *"https://portal.skunkworksacademy.com"* ]]; then
            echo "PORTAL_ALLOWED_ORIGINS must include https://portal.skunkworksacademy.com." >&2
            exit 1
          fi

      - name: Azure login using workload identity
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          auth-type: SERVICE_PRINCIPAL

      - name: Confirm Azure context
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            actual_subscription="$(az account show --query id -o tsv)"
            actual_tenant="$(az account show --query tenantId -o tsv)"
            if [ "$actual_subscription" != "$AZURE_SUBSCRIPTION_ID" ]; then
              echo "Azure login selected unexpected subscription: $actual_subscription" >&2
              exit 1
            fi
            if [ "$actual_tenant" != "$AZURE_TENANT_ID" ]; then
              echo "Azure login selected unexpected tenant: $actual_tenant" >&2
              exit 1
            fi
            az account show --query '{subscription:id,tenant:tenantId,name:name}' -o json

      - name: Provision Function App infrastructure
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            az deployment sub create \
              --name portal-api-${{ github.run_number }} \
              --location "$LOCATION" \
              --template-file infra/main.bicep \
              --parameters \
                location="$LOCATION" \
                resourceGroupName="$RESOURCE_GROUP_NAME" \
                functionAppName="$FUNCTION_APP_NAME" \
                storageAccountName="$STORAGE_ACCOUNT_NAME" \
                entraTenantId="$PORTAL_ENTRA_TENANT_ID" \
                portalClientId="$PORTAL_ENTRA_CLIENT_ID" \
                applicationIdUri="$PORTAL_APPLICATION_ID_URI" \
                apiScope="$PORTAL_API_SCOPE" \
                allowedOrigins="$PORTAL_ALLOWED_ORIGINS" \
                sharePointHostname="$PORTAL_SHAREPOINT_HOSTNAME" \
                sharePointSitePath="$PORTAL_SHAREPOINT_SITE_PATH"

      - name: Restore protected API credential
        uses: azure/cli@v2
        env:
          API_CLIENT_SECRET: ${{ secrets.PORTAL_API_CLIENT_SECRET }}
        with:
          inlineScript: |
            set -euo pipefail
            if [ -z "${API_CLIENT_SECRET:-}" ]; then
              echo "Missing required GitHub Actions secret: PORTAL_API_CLIENT_SECRET" >&2
              exit 1
            fi
            az functionapp config appsettings set \
              --resource-group "$RESOURCE_GROUP_NAME" \
              --name "$FUNCTION_APP_NAME" \
              --settings "API_CLIENT_SECRET=$API_CLIENT_SECRET" \
              --output none


      - name: Restore Skunkie Azure OpenAI configuration
        uses: azure/cli@v2
        env:
          SKUNKIE_ENDPOINT: ${{ vars.PORTAL_AZURE_OPENAI_ENDPOINT }}
          SKUNKIE_DEPLOYMENT: ${{ vars.PORTAL_AZURE_OPENAI_DEPLOYMENT }}
          SKUNKIE_API_VERSION: ${{ vars.PORTAL_AZURE_OPENAI_API_VERSION || '2024-10-21' }}
          SKUNKIE_API_KEY: ${{ secrets.PORTAL_AZURE_OPENAI_API_KEY }}
        with:
          inlineScript: |
            set -euo pipefail
            if [ -n "${SKUNKIE_ENDPOINT:-}" ] && [ -n "${SKUNKIE_DEPLOYMENT:-}" ] && [ -n "${SKUNKIE_API_KEY:-}" ]; then
              if [[ "$SKUNKIE_ENDPOINT" != https://* ]]; then
                echo "Skunkie Azure OpenAI endpoint must use HTTPS." >&2
                exit 1
              fi
              az functionapp config appsettings set \
                --resource-group "$RESOURCE_GROUP_NAME" \
                --name "$FUNCTION_APP_NAME" \
                --settings "AZURE_OPENAI_ENDPOINT=$SKUNKIE_ENDPOINT" \
                           "AZURE_OPENAI_DEPLOYMENT=$SKUNKIE_DEPLOYMENT" \
                           "AZURE_OPENAI_API_VERSION=$SKUNKIE_API_VERSION" \
                           "AZURE_OPENAI_API_KEY=$SKUNKIE_API_KEY" \
                --output none
              echo "Skunkie provider settings restored securely from production environment configuration."
            else
              echo "::warning::Skunkie AI is not configured. Supply PORTAL_AZURE_OPENAI_ENDPOINT, PORTAL_AZURE_OPENAI_DEPLOYMENT (GitHub environment variables) and PORTAL_AZURE_OPENAI_API_KEY (production environment secret)."
              echo "- Skunkie AI: configuration incomplete. Chat will display an availability notice until provisioned." >> "$GITHUB_STEP_SUMMARY"
            fi

      - name: Assemble Function deployment package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf function-package function-package.zip
          mkdir -p function-package
          cp -R api-dist function-package/api-dist
          cp host.json package.json package-lock.json function-package/
          cd function-package
          npm ci --omit=dev
          zip -qr ../function-package.zip .

      - name: Deploy Function package through Azure CLI
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            az functionapp deployment source config-zip \
              --resource-group "$RESOURCE_GROUP_NAME" \
              --name "$FUNCTION_APP_NAME" \
              --src function-package.zip \
              --build-remote false \
              --timeout 600 \
              --output json

      - name: Restart Function App
        uses: azure/cli@v2
        with:
          inlineScript: az functionapp restart --resource-group "$RESOURCE_GROUP_NAME" --name "$FUNCTION_APP_NAME"

      - name: Verify deployed application settings
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            az functionapp config appsettings list \
              --resource-group "$RESOURCE_GROUP_NAME" \
              --name "$FUNCTION_APP_NAME" \
              --query "[?name=='ENTRA_TENANT_ID' || name=='API_CLIENT_ID' || name=='SPA_CLIENT_ID' || name=='APPLICATION_ID_URI' || name=='API_SCOPE' || name=='ALLOWED_ORIGINS'].{name:name,value:value}" \
              -o table

      - name: Verify API health
        shell: bash
        run: |
          set -euo pipefail
          API_HOSTNAME="$(az functionapp show --resource-group "$RESOURCE_GROUP_NAME" --name "$FUNCTION_APP_NAME" --query defaultHostName -o tsv)"
          if [ -z "$API_HOSTNAME" ]; then
            echo "Azure did not return the Function App default hostname." >&2
            exit 1
          fi
          API_BASE_URL="https://${API_HOSTNAME}/api"
          API_URL="$API_BASE_URL/health"
          echo "Checking $API_URL"
          for attempt in {1..18}; do
            if response=$(curl --fail --silent --show-error --max-time 20 "$API_URL") &&               echo "$response" | jq -e '.ok == true and ((.missingSettings // []) | length == 0) and ((.routes // []) | index("GET /api/staff/applications") != null)' >/dev/null; then
              echo "$response"
              break
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "Function health check or required admin route validation failed after 18 attempts." >&2
              exit 1
            fi
            echo "Health check attempt $attempt failed; retrying in 10 seconds."
            sleep 10
          done
          echo "$response" | jq -e '(.routes // [] | index("POST /api/skunkie/chat") != null) and (.routes // [] | index("GET /api/skunkie/status") != null)' >/dev/null
          skunkie_status=$(curl --silent --show-error --max-time 20 --output /tmp/skunkie-status.body --write-out '%{http_code}' "$API_BASE_URL/skunkie/status" || true)
          case "$skunkie_status" in
            401|403) echo "Skunkie status endpoint exists and requires Microsoft authentication." ;;
            *) echo "Expected HTTP 401/403 from protected Skunkie status; received $skunkie_status." >&2; exit 1 ;;
          esac
          if echo "$response" | jq -e '.skunkieSettings.configured == true' >/dev/null; then
            echo "- Skunkie AI: configuration present (live generation still requires authenticated functional test)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Skunkie AI is not configured in the running Function App."
            echo "- Skunkie AI: unavailable until production Azure OpenAI settings are configured." >> "$GITHUB_STEP_SUMMARY"
          fi
          admin_status=$(curl --silent --show-error --location --max-time 20 --output /tmp/admin-applications.body --write-out '%{http_code}' "$API_BASE_URL/staff/applications" || true)
          case "$admin_status" in
            401|403) echo "Staff applications endpoint resolved and correctly requires authentication (HTTP $admin_status)." ;;
            *)
              echo "Expected an unauthenticated 401 or 403 from $API_BASE_URL/staff/applications, received HTTP $admin_status." >&2
              head -c 500 /tmp/admin-applications.body || true
              exit 1
              ;;
          esac
          {
            echo "### Portal API validation"
            echo ""
            echo "- Canonical API base URL: $API_BASE_URL"
            echo "- Required staff applications route: reachable (authentication enforced)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify AI publication and default-deny access contract
        shell: bash
        run: |
          set -euo pipefail
          API_HOSTNAME="$(az functionapp show --resource-group "$RESOURCE_GROUP_NAME" --name "$FUNCTION_APP_NAME" --query defaultHostName -o tsv)"
          API_BASE_URL="https://${API_HOSTNAME}/api"
          response="$(curl --fail --silent --show-error --retry 4 --retry-delay 5 --max-time 30 "$API_BASE_URL/course-publication")"
          echo "$response" | jq -e '
            .schema == "skunkworks-academy/course-publication/v1"
            and .policy == "default-deny"
            and (.courses | length == 27)
            and ([.courses[] | select(.source == "generated-foundation" and .publicationStatus == "review" and .enrolmentStatus == "enquiry-only" and .checkoutUrl == null)] | length == 19)
            and ([.courses[] | select(.publicationStatus == "published" and .enrolmentStatus == "portal-allowlisted")] | length == 8)
            and ([.courses[] | select(.courseId == "SWA-AI-001" and .checkoutUrl != null)] | length == 0)
          ' >/dev/null
          http_status="$(curl --silent --show-error --max-time 20 -o /tmp/access-denied.txt -w '%{http_code}' "$API_BASE_URL/course-access?courseId=SWA-AI-001" || true)"
          case "$http_status" in
            401|403|404) echo "Unauthenticated course access denied: HTTP $http_status" ;;
            *) echo "Expected access denial, received HTTP $http_status" >&2; exit 1 ;;
          esac
          {
            echo "### AI course publication"
            echo "- Public API status contract returned 27 records."
            echo "- 19 generated AI courses remain review-only with no checkout URL."
            echo "- Eight legacy portal courses retain published state."
            echo "- Unauthenticated course-access request denied (HTTP $http_status)."
          } >> "$GITHUB_STEP_SUMMARY"
