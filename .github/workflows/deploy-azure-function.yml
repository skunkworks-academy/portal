name: Deploy Azure Function

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - api/**
      - host.json
      - package.json
      - package-lock.json
      - tsconfig.api.json
      - .github/workflows/deploy-azure-function.yml

permissions:
  contents: read
  id-token: write
  actions: write

concurrency:
  group: portal-api-production
  cancel-in-progress: false

env:
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  RESOURCE_GROUP_NAME: ${{ vars.AZURE_RESOURCE_GROUP_NAME || 'rg-skunkworks-academy-portal-prod' }}
  FUNCTION_APP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME || 'skunkworks-academy-portal-api-ca' }}
  PORTAL_ENTRA_TENANT_ID: ${{ vars.PORTAL_ENTRA_TENANT_ID || '338a8916-80d9-467c-a94a-7f61d04ef7d5' }}
  PORTAL_ENTRA_CLIENT_ID: ${{ vars.PORTAL_ENTRA_CLIENT_ID || 'e22672ae-61a6-434e-b135-3360557819ec' }}
  PORTAL_APPLICATION_ID_URI: ${{ vars.PORTAL_APPLICATION_ID_URI || 'api://e22672ae-61a6-434e-b135-3360557819ec' }}
  PORTAL_API_SCOPE: ${{ vars.PORTAL_API_SCOPE || 'api://e22672ae-61a6-434e-b135-3360557819ec/access_as_user' }}
  PORTAL_ALLOWED_ORIGINS: ${{ vars.PORTAL_ALLOWED_ORIGINS || 'https://portal.skunkworksacademy.com,http://localhost:5173' }}
  PORTAL_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api.skunkworksacademy.com/api' }}
  PORTAL_API_CLIENT_SECRET: ${{ secrets.PORTAL_API_CLIENT_SECRET }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:api

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:api

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in AZURE_SUBSCRIPTION_ID AZURE_TENANT_ID AZURE_CLIENT_ID FUNCTION_APP_NAME PORTAL_ENTRA_TENANT_ID PORTAL_ENTRA_CLIENT_ID PORTAL_APPLICATION_ID_URI PORTAL_API_SCOPE PORTAL_ALLOWED_ORIGINS PORTAL_API_BASE_URL PORTAL_API_CLIENT_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions variable or secret: $name" >&2
              exit 1
            fi
          done
          [ "$PORTAL_APPLICATION_ID_URI" = "api://$PORTAL_ENTRA_CLIENT_ID" ]
          [ "$PORTAL_API_SCOPE" = "$PORTAL_APPLICATION_ID_URI/access_as_user" ]
          case "$PORTAL_API_BASE_URL" in https://*/api) ;; *) echo "VITE_API_BASE_URL must be an HTTPS URL ending in /api." >&2; exit 1 ;; esac ;;

      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          auth-type: SERVICE_PRINCIPAL

      - name: Confirm existing Flex Consumption target
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            az functionapp show               --resource-group "$RESOURCE_GROUP_NAME"               --name "$FUNCTION_APP_NAME"               --query '{name:name,state:properties.state,sku:properties.sku,host:properties.defaultHostName}'               --output json

      - name: Configure portal API
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            az functionapp cors add               --resource-group "$RESOURCE_GROUP_NAME"               --name "$FUNCTION_APP_NAME"               --allowed-origins https://portal.skunkworksacademy.com http://localhost:5173               --output none
            az functionapp config appsettings set               --resource-group "$RESOURCE_GROUP_NAME"               --name "$FUNCTION_APP_NAME"               --settings                 ENTRA_TENANT_ID="$PORTAL_ENTRA_TENANT_ID"                 API_CLIENT_ID="$PORTAL_ENTRA_CLIENT_ID"                 API_CLIENT_SECRET="$PORTAL_API_CLIENT_SECRET"                 SPA_CLIENT_ID="$PORTAL_ENTRA_CLIENT_ID"                 APPLICATION_ID_URI="$PORTAL_APPLICATION_ID_URI"                 API_SCOPE="$PORTAL_API_SCOPE"                 GRAPH_TENANT_ID="$PORTAL_ENTRA_TENANT_ID"                 SHAREPOINT_HOSTNAME="skunkworksacademy.sharepoint.com"                 SHAREPOINT_SITE_PATH="/sites/InstructorPortal"                 ALLOWED_ORIGINS="$PORTAL_ALLOWED_ORIGINS"               --output none

      - name: Assemble Function package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf function-package function-package.zip
          mkdir -p function-package
          cp -R api-dist function-package/api-dist
          cp host.json package.json package-lock.json function-package/
          cd function-package
          npm ci --omit=dev
          zip -qr ../function-package.zip .

      - name: Deploy to Flex Consumption
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            az functionapp deployment source config-zip               --resource-group "$RESOURCE_GROUP_NAME"               --name "$FUNCTION_APP_NAME"               --src function-package.zip               --build-remote false               --timeout 600               --output json

      - name: Verify API through custom domain
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_URL="${PORTAL_API_BASE_URL%/}/health"
          echo "Checking $HEALTH_URL"
          for attempt in {1..18}; do
            if response="$(curl --fail --silent --show-error --max-time 20 -H "Origin: https://portal.skunkworksacademy.com" "$HEALTH_URL")"; then
              node -e 'const health = JSON.parse(process.argv[1]); if (health.ok !== true || (health.missingSettings || []).length) process.exit(1)' "$response"
              exit 0
            fi
            [ "$attempt" -eq 18 ] && exit 1
            sleep 10
          done

      - name: Redeploy portal frontend with the API domain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f api_base_url="$PORTAL_API_BASE_URL"
