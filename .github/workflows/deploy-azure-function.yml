name: Deploy Azure Function

on:
  workflow_dispatch:
    inputs:
      function_app_name:
        description: Globally unique Azure Function App name
        required: true
        default: skunkworks-academy-portal-api-za
      storage_account_name:
        description: Globally unique lowercase storage account name
        required: true
        default: stskunkportal12345
      location:
        description: Azure region
        required: true
        default: southafricanorth
  push:
    branches: [main]
    paths:
      - api/**
      - host.json
      - package.json
      - package-lock.json
      - tsconfig.api.json
      - infra/**
      - .github/workflows/deploy-azure-function.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: portal-api-production
  cancel-in-progress: false

env:
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  RESOURCE_GROUP_NAME: ${{ vars.AZURE_RESOURCE_GROUP_NAME || 'rg-skunkworks-academy-portal-prod' }}
  FUNCTION_APP_NAME: ${{ inputs.function_app_name || vars.AZURE_FUNCTIONAPP_NAME }}
  STORAGE_ACCOUNT_NAME: ${{ inputs.storage_account_name || vars.AZURE_STORAGE_ACCOUNT_NAME }}
  LOCATION: ${{ inputs.location || vars.AZURE_LOCATION || 'southafricanorth' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:api
      - name: Validate Bicep
        uses: azure/cli@v2
        with:
          inlineScript: az bicep build --file infra/main.bicep

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:api

      - name: Verify deployment variables
        shell: bash
        run: |
          set -euo pipefail
          for name in AZURE_SUBSCRIPTION_ID AZURE_TENANT_ID AZURE_CLIENT_ID FUNCTION_APP_NAME STORAGE_ACCOUNT_NAME; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions variable: $name" >&2
              exit 1
            fi
          done

      - name: Azure login using workload identity
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Provision Function App infrastructure
        uses: azure/cli@v2
        with:
          inlineScript: |
            az deployment sub create \
              --name portal-api-${{ github.run_number }} \
              --location "$LOCATION" \
              --template-file infra/main.bicep \
              --parameters \
                location="$LOCATION" \
                resourceGroupName="$RESOURCE_GROUP_NAME" \
                functionAppName="$FUNCTION_APP_NAME" \
                storageAccountName="$STORAGE_ACCOUNT_NAME" \
                entraTenantId="338a8916-80d9-467c-a94a-7f61d04ef7d5" \
                portalClientId="e22672ae-61a6-434e-b135-3360557819ec"

      - name: Assemble Function deployment package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf function-package function-package.zip
          mkdir -p function-package
          cp -R api-dist function-package/api-dist
          cp host.json package.json package-lock.json function-package/
          cd function-package
          npm ci --omit=dev
          zip -qr ../function-package.zip .

      - name: Deploy Function package
        uses: azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: function-package.zip

      - name: Verify API health
        shell: bash
        run: |
          set -euo pipefail
          API_URL="https://${FUNCTION_APP_NAME}.azurewebsites.net/api/health"
          echo "Checking $API_URL"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "$API_URL"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
