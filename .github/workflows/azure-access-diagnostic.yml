name: Diagnose Azure deployment access

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AZURE_CLIENT_ID_VALUE: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID_VALUE: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID_VALUE: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_CREDENTIALS_VALUE: ${{ secrets.AZURE_CREDENTIALS }}
      FUNCTION_PUBLISH_PROFILE_VALUE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
      PORTAL_PUBLISH_PROFILE_VALUE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE_PORTAL }}
    steps:
      - name: Report credential availability without exposing values
        shell: bash
        run: |
          set -euo pipefail
          report() {
            local label="$1"
            local value="$2"
            if [[ -n "${value}" ]]; then
              echo "${label}=present"
            else
              echo "${label}=missing"
            fi
          }
          report AZURE_CLIENT_ID "${AZURE_CLIENT_ID_VALUE}"
          report AZURE_TENANT_ID "${AZURE_TENANT_ID_VALUE}"
          report AZURE_SUBSCRIPTION_ID "${AZURE_SUBSCRIPTION_ID_VALUE}"
          report AZURE_CREDENTIALS "${AZURE_CREDENTIALS_VALUE}"
          report AZURE_FUNCTIONAPP_PUBLISH_PROFILE "${FUNCTION_PUBLISH_PROFILE_VALUE}"
          report AZURE_FUNCTIONAPP_PUBLISH_PROFILE_PORTAL "${PORTAL_PUBLISH_PROFILE_VALUE}"
