# Temporary, branch-scoped workflow to remediate dependency advisories for PR #123.
# Remove this file after the package lockfile has been refreshed and verified.
name: PR123 security dependency refresh
on:
  push:
    branches:
      - feature/academy-unified-operations-workspace-20261026
    paths:
      - .github/workflows/pr123-refresh-dependencies.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/academy-unified-operations-workspace-20261026
          persist-credentials: true
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Refresh resolved dependencies
        run: |
          set -euo pipefail
          npm install -g npm@11.19.1
          npm --version
          npm ci
          # npm audit fix currently crashes on the repository's dependency tree
          # (npm CLI error: Cannot read properties of null, reading edgesOut).
          # Upgrade known vulnerable packages explicitly without suppressing advisories.
          npm install --save-exact @azure/msal-node@7.1.0 --ignore-scripts
          npm install --save-exact vite@8.3.5 --ignore-scripts
          npm audit --omit=dev --audit-level=high
      - name: Commit dependency-only lockfile refresh
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependencies were already current."
          else
            git commit -m "fix(security): upgrade patched Vite and MSAL dependencies"
            git push origin HEAD:feature/academy-unified-operations-workspace-20261026
          fi
