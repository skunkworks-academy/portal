name: Deploy portal frontend

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Discovered Azure Function API base URL ending in /api
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PORTAL_ENTRA_TENANT_ID: ${{ vars.PORTAL_ENTRA_TENANT_ID || '338a8916-80d9-467c-a94a-7f61d04ef7d5' }}
  PORTAL_ENTRA_CLIENT_ID: ${{ vars.PORTAL_ENTRA_CLIENT_ID || 'e22672ae-61a6-434e-b135-3360557819ec' }}
  PORTAL_APPLICATION_ID_URI: ${{ vars.PORTAL_APPLICATION_ID_URI || 'api://e22672ae-61a6-434e-b135-3360557819ec' }}
  PORTAL_API_SCOPE: ${{ vars.PORTAL_API_SCOPE || 'api://e22672ae-61a6-434e-b135-3360557819ec/access_as_user' }}
  PORTAL_API_BASE_URL: ${{ inputs.api_base_url || vars.VITE_API_BASE_URL || 'https://skunkworks-instructor-portal-api-a5gxhyc2fvc7gmch.southafricanorth-01.azurewebsites.net/api' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify frontend authentication and API configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in PORTAL_ENTRA_TENANT_ID PORTAL_ENTRA_CLIENT_ID PORTAL_APPLICATION_ID_URI PORTAL_API_SCOPE PORTAL_API_BASE_URL; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required portal variable: $name" >&2
              exit 1
            fi
          done
          case "$PORTAL_APPLICATION_ID_URI" in
            "api://${PORTAL_ENTRA_CLIENT_ID}") ;;
            *) echo "PORTAL_APPLICATION_ID_URI must match api://PORTAL_ENTRA_CLIENT_ID" >&2; exit 1 ;;
          esac
          case "$PORTAL_API_SCOPE" in
            "${PORTAL_APPLICATION_ID_URI}/"*) ;;
            *) echo "PORTAL_API_SCOPE must be a scope exposed by PORTAL_APPLICATION_ID_URI" >&2; exit 1 ;;
          esac
          case "$PORTAL_API_BASE_URL" in
            https://*/api) ;;
            *) echo "PORTAL_API_BASE_URL must be an HTTPS URL ending in /api" >&2; exit 1 ;;
          esac

      - name: Verify Portal API health and browser CORS
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_URL="${PORTAL_API_BASE_URL%/}/health"
          PREFLIGHT_URL="${PORTAL_API_BASE_URL%/}/admin/applications"
          HEALTH_BODY="$(mktemp)"
          HEALTH_HEADERS="$(mktemp)"
          CORS_HEADERS="$(mktemp)"

          echo "Checking Portal API health at $HEALTH_URL"
          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 30 \
            -H "Origin: https://portal.skunkworksacademy.com" \
            -D "$HEALTH_HEADERS" \
            -o "$HEALTH_BODY" \
            "$HEALTH_URL"

          node - "$HEALTH_BODY" <<'NODE'
          const fs = require("node:fs");
          const path = process.argv[2];
          const health = JSON.parse(fs.readFileSync(path, "utf8"));
          if (health.ok !== true) {
            console.error("Portal API health response did not contain ok: true.");
            process.exit(1);
          }
          if (Array.isArray(health.missingSettings) && health.missingSettings.length > 0) {
            console.warn(`Portal API reports missing settings: ${health.missingSettings.join(", ")}`);
          }
          console.log(JSON.stringify(health));
          NODE

          if ! grep -Eiq '^access-control-allow-origin:[[:space:]]*https://portal\.skunkworksacademy\.com[[:space:]]*$' "$HEALTH_HEADERS"; then
            echo "Health response does not allow the Portal production origin." >&2
            cat "$HEALTH_HEADERS" >&2
            exit 1
          fi

          echo "Checking authenticated-route CORS preflight at $PREFLIGHT_URL"
          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 30 \
            -X OPTIONS \
            -H "Origin: https://portal.skunkworksacademy.com" \
            -H "Access-Control-Request-Method: GET" \
            -H "Access-Control-Request-Headers: authorization" \
            -D "$CORS_HEADERS" \
            -o /dev/null \
            "$PREFLIGHT_URL"

          if ! grep -Eiq '^access-control-allow-origin:[[:space:]]*https://portal\.skunkworksacademy\.com[[:space:]]*$' "$CORS_HEADERS"; then
            echo "Authenticated-route preflight does not allow the Portal production origin." >&2
            cat "$CORS_HEADERS" >&2
            exit 1
          fi

      - run: npm run build
        env:
          VITE_MSAL_CLIENT_ID: ${{ env.PORTAL_ENTRA_CLIENT_ID }}
          VITE_API_CLIENT_ID: ${{ env.PORTAL_ENTRA_CLIENT_ID }}
          VITE_APPLICATION_ID_URI: ${{ env.PORTAL_APPLICATION_ID_URI }}
          VITE_MSAL_AUTHORITY: https://login.microsoftonline.com/${{ env.PORTAL_ENTRA_TENANT_ID }}
          VITE_API_SCOPE: ${{ env.PORTAL_API_SCOPE }}
          VITE_API_BASE_URL: ${{ env.PORTAL_API_BASE_URL }}
          VITE_SKUNKWORKS_TENANT_ID: ${{ env.PORTAL_ENTRA_TENANT_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
