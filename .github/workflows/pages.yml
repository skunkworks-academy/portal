name: Deploy portal frontend

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Portal API base URL ending in /api
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PORTAL_ENTRA_TENANT_ID: ${{ vars.PORTAL_ENTRA_TENANT_ID || '338a8916-80d9-467c-a94a-7f61d04ef7d5' }}
  PORTAL_ENTRA_CLIENT_ID: ${{ vars.PORTAL_ENTRA_CLIENT_ID || 'e22672ae-61a6-434e-b135-3360557819ec' }}
  PORTAL_APPLICATION_ID_URI: ${{ vars.PORTAL_APPLICATION_ID_URI || 'api://e22672ae-61a6-434e-b135-3360557819ec' }}
  PORTAL_API_SCOPE: ${{ vars.PORTAL_API_SCOPE || 'api://e22672ae-61a6-434e-b135-3360557819ec/access_as_user' }}
  PORTAL_API_BASE_URL: ${{ inputs.api_base_url || vars.PORTAL_API_BASE_URL || 'https://api.skunkworksacademy.com/api' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify frontend authentication and API configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in PORTAL_ENTRA_TENANT_ID PORTAL_ENTRA_CLIENT_ID PORTAL_APPLICATION_ID_URI PORTAL_API_SCOPE PORTAL_API_BASE_URL; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required portal variable: $name" >&2
              exit 1
            fi
          done
          case "$PORTAL_APPLICATION_ID_URI" in
            "api://${PORTAL_ENTRA_CLIENT_ID}") ;;
            *) echo "PORTAL_APPLICATION_ID_URI must match api://PORTAL_ENTRA_CLIENT_ID" >&2; exit 1 ;;
          esac
          case "$PORTAL_API_SCOPE" in
            "${PORTAL_APPLICATION_ID_URI}/"*) ;;
            *) echo "PORTAL_API_SCOPE must be a scope exposed by PORTAL_APPLICATION_ID_URI" >&2; exit 1 ;;
          esac
          case "$PORTAL_API_BASE_URL" in
            https://*/api) ;;
            *) echo "PORTAL_API_BASE_URL must be an HTTPS URL ending in /api" >&2; exit 1 ;;
          esac
      - run: npm run build
        env:
          VITE_MSAL_CLIENT_ID: ${{ env.PORTAL_ENTRA_CLIENT_ID }}
          VITE_API_CLIENT_ID: ${{ env.PORTAL_ENTRA_CLIENT_ID }}
          VITE_APPLICATION_ID_URI: ${{ env.PORTAL_APPLICATION_ID_URI }}
          VITE_MSAL_AUTHORITY: https://login.microsoftonline.com/${{ env.PORTAL_ENTRA_TENANT_ID }}
          VITE_API_SCOPE: ${{ env.PORTAL_API_SCOPE }}
          VITE_API_BASE_URL: ${{ env.PORTAL_API_BASE_URL }}
          VITE_SKUNKWORKS_TENANT_ID: ${{ env.PORTAL_ENTRA_TENANT_ID }}
      - name: Verify compiled canonical API target
        shell: bash
        run: |
          set -euo pipefail
          expected="${PORTAL_API_BASE_URL%/}"
          if ! grep -R --fixed-strings --quiet "$expected" dist; then
            echo "The production build does not contain the configured Portal API endpoint: $expected" >&2
            exit 1
          fi
          if grep -R --fixed-strings --quiet '/admin/' dist; then
            echo 'The production build still contains Azure Functions reserved admin route segments.' >&2
            exit 1
          fi
          if ! grep -R --fixed-strings --quiet '/staff/' dist; then
            echo 'The production build does not contain the required staff privileged route family.' >&2
            exit 1
          fi
      - name: Enforce Academy global shell on every generated HTML page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          current = 'https://skunkworksacademy.com/assets/academy-navigation.js?v=2026.08.15.2'
          loader = f'<script defer src="{current}" data-skunkworks-global-shell="2026.08.15.2"></script>'
          pattern = r"https://skunkworksacademy\.com/assets/academy-navigation\.js(?:\?v=[^\"'\s<>]+)?"
          pages = list(Path('dist').rglob('*.html'))
          for path in pages:
              html = path.read_text(encoding='utf-8', errors='ignore')
              if 'academy-navigation.js' in html:
                  html = re.sub(pattern, current, html)
              elif '</head>' in html:
                  html = html.replace('</head>', f'{loader}</head>', 1)
              elif '</body>' in html:
                  html = html.replace('</body>', f'{loader}</body>', 1)
              else:
                  raise SystemExit(f'Cannot inject Academy shell into {path}')
              path.write_text(html, encoding='utf-8')
          if not pages:
              raise SystemExit('Portal build produced no HTML pages.')
          missing = [str(p) for p in pages if current not in p.read_text(encoding='utf-8', errors='ignore')]
          if missing:
              raise SystemExit('Global shell missing from: ' + ', '.join(missing))
          print(f'Verified Academy global shell on {len(pages)} Portal page(s).')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
