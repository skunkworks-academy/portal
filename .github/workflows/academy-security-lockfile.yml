name: Temporary feature build diagnostics

on:
  push:
    branches:
      - feature/academy-unified-operations-workspace-20261026
    paths:
      - .github/workflows/academy-security-lockfile.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:api
