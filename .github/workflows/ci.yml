name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Generate Teams icons
        run: npm run teams:icons

      - name: Validate Teams manifest
        run: npm run teams:validate

      - name: Build frontend and API
        id: build
        shell: bash
        run: |
          set -o pipefail
          (npm run build && npm run build:api) 2>&1 | tee build-output.log

      - name: Upload build diagnostics
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: portal-build-diagnostics
          path: build-output.log
          if-no-files-found: error
          retention-days: 7
