name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate PowerShell script syntax
        shell: pwsh
        run: |
          $Failed = $false

          Get-ChildItem -Path ./scripts -Filter *.ps1 -File -Recurse | ForEach-Object {
            $Tokens = $null
            $ParseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$Tokens,
              [ref]$ParseErrors
            )

            if (@($ParseErrors).Count -gt 0) {
              $Failed = $true
              Write-Error "PowerShell syntax validation failed: $($_.FullName)"
              $ParseErrors | ForEach-Object {
                Write-Error "$($_.Extent.StartLineNumber):$($_.Extent.StartColumnNumber) $($_.Message)"
              }
            }
          }

          if ($Failed) {
            throw "One or more PowerShell scripts contain parser errors."
          }

      - name: Run tests
        run: npm test

      - name: Generate Teams icons
        run: npm run teams:icons

      - name: Validate Teams manifest
        run: npm run teams:validate

      - name: Build frontend and API
        id: build
        shell: bash
        run: |
          set -o pipefail
          (npm run build && npm run build:api) 2>&1 | tee build-output.log

      - name: Assert non-reserved Azure Functions route namespace
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E 'route: "admin/|app\.http\("admin' api; then
            echo 'Azure Functions reserves the admin namespace; use /api/staff/* and staff-prefixed function names.' >&2
            exit 1
          fi
          grep --fixed-strings --quiet 'route: "staff/applications"' api/functions.ts
          grep --fixed-strings --quiet 'app.http("staffApplications"' api/functions.ts
          grep --fixed-strings --quiet '"/staff/applications"' src/api.ts

      - name: Upload build diagnostics
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: portal-build-diagnostics
          path: build-output.log
          if-no-files-found: error
          retention-days: 7
