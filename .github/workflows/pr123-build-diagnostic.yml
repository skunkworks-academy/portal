name: PR123 Build and Tests (Diagnostic)
on:
  push:
    branches:
      - feature/academy-unified-operations-workspace-20261026
    paths:
      - .github/workflows/pr123-build-diagnostic.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/academy-unified-operations-workspace-20261026
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:api
